<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSC 138 Has Moved</title>
    <script>
      const views = ['dashboard', 'roadmap', 'chapter1', 'practice', 'reference'];
      const path = window.location.hash.replace(/^#\/?/, '');
      const requested = path.startsWith('student/csc138/') ? path.split('/')[2] : path.split('/')[0];
      const view = views.includes(requested) ? requested : 'dashboard';
      window.location.replace('/' + window.location.search + '#/student/csc138/' + view);
    </script>
  </head>
  <body>
    <p>CSC 138 is now in the <a href="/#/student/csc138/dashboard">student study hub</a>.</p>
  </body>
</html>
